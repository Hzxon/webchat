# Runs the checks a pull request must pass: typecheck, the tests and the build.
# They also run on main and in the merge queue. See D-076 in docs/decisions.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A test that leaves a process behind once held a run for hours; the private repository pays for each minute.
    timeout-minutes: 15
    steps:
      # Pinned to commits, like the actions in release-please.yml and doc-ids.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The agent's single file must still build and run (docs/decisions/agent-install.md).
      - run: npm run build:agent && dist/agent/webchat-agent --version
