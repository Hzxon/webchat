# Turns the pull request titles merged into main into versions, the changelog
# and tags. See D-055 in docs/decisions.md.
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    # The owner's Linux server, which holds nothing else of value (docs/decisions/self-hosted-ci.md).
    runs-on: [self-hosted, linux]
    steps:
      # Pinned to a commit, because a moved tag would run other code with
      # write access to the repository.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

  # Ships the Claude Code plugin on the `plugin` branch, which is its marketplace: the plugin folder
  # as the release's tag has it. The plugin is skills only now, with no program to build, since the
  # agent runs from `webchat-agent setup` (docs/decisions/locked-room.md). Each release adds one commit there.
  plugin:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin plugin; then git worktree add -q -B plugin ../dist FETCH_HEAD; else git worktree add -q --orphan -b plugin ../dist; fi
          rsync -a --delete --exclude .git plugin/ ../dist/
          cd ../dist
          git add -A
          git commit -q -m "build(plugin): Ship $TAG"
          git push -q origin plugin

  # Builds the agent as one file per OS and processor, with Node inside, each on its own kind of
  # machine, where it must print the release before it ships with its checksum. One of them also
  # adds the install script, with this release's address (docs/decisions/agent-install.md).
  # Only the owner's two runners build, since the account has no Actions minutes, so Intel Macs and
  # ARM Linux get no file (docs/decisions/self-hosted-ci.md).
  agent:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      matrix:
        include:
          - { runner: [self-hosted, macos, arm64], file: webchat-agent-darwin-arm64 }
          - { runner: [self-hosted, linux, x64], file: webchat-agent-linux-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:agent
      - env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(dist/agent/webchat-agent --version)" = "${TAG#v}"
          gzip -c dist/agent/webchat-agent > ${{ matrix.file }}.gz
          shasum -a 256 ${{ matrix.file }}.gz > ${{ matrix.file }}.gz.sha256
          gh release upload "$TAG" ${{ matrix.file }}.gz ${{ matrix.file }}.gz.sha256
      - if: matrix.file == 'webchat-agent-linux-x64'
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s|@BASE@|https://github.com/${{ github.repository }}/releases/download/$TAG|g" agent/install.sh > install.sh
          gh release upload "$TAG" install.sh
