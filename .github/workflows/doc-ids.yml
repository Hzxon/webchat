# Fails a pull request that gives two entries the same id in the decision log
# or the roadmap. See D-063 in docs/decisions.md. It runs on main too: a pull
# request is checked against the main it started from, and nothing checks it
# again before it merges (D-076).
name: doc-ids

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unique-ids:
    runs-on: [self-hosted, linux]
    steps:
      # Pinned to a commit, like the action in release-please.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that no id is used twice
        run: |
          status=0
          check() {
            pattern=$1; shift
            dupes=$(cat "$@" | grep -oE "^### ($pattern):" | tr -d '#: ' | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "::error file=$1::Two headings share an id: $(echo $dupes)"
              status=1
            fi
          }
          check 'D-[0-9]+' docs/decisions.md
          if grep -q '^This file is a copy of the' docs/roadmap.md; then
            # A file docs/roadmap/<id>.md then changes an entry that the copy has (R-040).
            check '[KRQ]-[0-9]+' docs/roadmap.md
          else
            # Entries not yet folded into roadmap.md live as docs/roadmap/<id>.md (D-106).
            check '[KRQ]-[0-9]+' docs/roadmap.md $(ls docs/roadmap/[KRQ]-*.md 2>/dev/null)
          fi
          exit $status

  # The board in WebChat is the source of truth. Once the base branch holds a
  # copy of it, only the owner's agent edits docs/roadmap.md and
  # docs/decisions.md, on agent/board; everyone else proposes a file. Before
  # the board is linked this fails nothing (R-040, D-117).
  board-copy:
    if: github.event_name == 'pull_request' && github.head_ref != 'agent/board'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that no copy of the board was edited by hand
        env:
          BASE: ${{ github.base_ref }}
        run: |
          status=0
          changed=$(git diff --name-only "origin/$BASE...HEAD" -- docs/roadmap.md docs/decisions.md)
          for file in $changed; do
            if git grep -q -e '^This file is a copy of the' "origin/$BASE" -- "$file"; then
              echo "::error file=$file::$file is a copy of the project's board, so propose the change as a file under ${file%.md}/ instead (R-040)."
              status=1
            fi
          done
          exit $status
